const genCode = () => {
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  return Array.from({length: 6}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
};
const fmtDate = (d) => d ? new Date(d).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';

function dDay(examDate) {
  if (!examDate) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const exam = new Date(examDate); exam.setHours(0,0,0,0);
  const diff = Math.round((exam - today) / 86400000);
  if (diff > 0) return { text: `D-${diff}`, days: diff, urgent: diff <= 7, past: false };
  if (diff === 0) return { text: 'D-DAY', days: 0, urgent: true, past: false };
  return { text: `D+${-diff}`, days: diff, urgent: false, past: true };
}

function dDayBadge(examDate, big=false) {
  const d = dDay(examDate);
  if (!d) return '';
  const colorClass = d.past ? 'bg-slate-100 text-slate-500' : d.urgent ? 'bg-rose-100 text-rose-700' : 'bg-indigo-100 text-indigo-700';
  if (big) return `<span class="inline-flex items-center justify-center font-bold rounded-lg px-3 py-1.5 text-base ${colorClass}">${d.text}</span>`;
  return `<span class="inline-flex items-center justify-center font-semibold rounded-md px-2 py-0.5 text-xs ${colorClass}">${d.text}</span>`;
}

function toast(msg, type='info') {
  const t = document.createElement('div');
  const colors = { info: 'bg-slate-800', success: 'bg-emerald-600', error: 'bg-rose-600' };
  t.className = `fixed top-6 left-1/2 -translate-x-1/2 ${colors[type]} text-white px-5 py-2.5 rounded-lg shadow-lg z-[100] text-sm font-medium`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

function showError(error, container = app) {
  container.innerHTML = `
    <div class="max-w-md mx-auto mt-20 p-6 bg-rose-50 border border-rose-200 rounded-xl">
      <div class="font-bold text-rose-700 mb-2">오류가 발생했어요</div>
      <div class="text-sm text-rose-600 mb-3 break-all">${esc(error.message || '')}</div>
      <div class="text-xs text-rose-500 mb-3">코드: ${esc(error.code || '?')}</div>
      <button onclick="location.reload()" class="text-sm bg-rose-600 text-white px-3 py-1.5 rounded">새로고침</button>
    </div>`;
}

function avgLevel(arr) {
  const v = arr.filter(x => x != null);
  if (!v.length) return null;
  const score = v.reduce((s,x) => s + SCORES[x], 0) / v.length;
  let best = 0, minD = Infinity;
  SCORES.forEach((s,i) => { if (Math.abs(s-score) < minD) { minD = Math.abs(s-score); best = i; } });
  return { idx: best, label: LEVELS[best], score };
}

function levelBadge(l) {
  if (l == null) return `<span class="text-slate-300 text-xs">-</span>`;
  return `<span class="inline-flex items-center justify-center font-medium rounded px-2 py-0.5 text-xs" style="background:${LEVEL_BG[l]};color:${LEVEL_TEXT[l]}">${LEVELS[l]}</span>`;
}
function levelBadgeBig(l) {
  if (l == null) return `<span class="text-slate-300 text-sm">-</span>`;
  return `<span class="inline-flex items-center justify-center font-semibold rounded-md px-3 py-1 text-sm" style="background:${LEVEL_COLORS[l]};color:white">${LEVELS[l]}</span>`;
}

function levelSelector(currentLevel, dataAttrs = '') {
  return `
    <div class="grid grid-cols-5 gap-1" ${dataAttrs}>
      ${LEVELS.map((label, i) => `
        <button type="button" data-level="${i}" class="lvl-btn ${currentLevel === i ? 'active' : ''} py-1.5 rounded text-xs font-medium transition" style="${currentLevel === i ? `background:${LEVEL_COLORS[i]};color:white` : 'background:#f1f5f9;color:#64748b'}">${label}</button>
      `).join('')}
    </div>`;
}

async function uploadImage(file) {
  if (!file) return null;
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const filename = `${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const { error } = await sb.storage.from('questions').upload(filename, file, { contentType: file.type });
  if (error) { toast('이미지 업로드 실패: ' + error.message, 'error'); return null; }
  const { data } = sb.storage.from('questions').getPublicUrl(filename);
  return data.publicUrl;
}

}

    sb.from('passages').select('*').eq('exam_id', s.exam_id).order('sort_order'),
    sb.from('evaluations').select('*').eq('student_id', s.id),
    sb.from('questions').select('*').eq('student_id', s.id).order('created_at', { ascending: false }),

  const tAvg = avgLevel(tLevels);

        <div class="flex justify-between items-center mb-4">
          ${logoHeader()}

              <div class="text-xs text-slate-500">${esc(s.school || '')} ${esc(s.grade || '')}</div>
              <div class="text-xl font-bold">${esc(s.name)} 학생</div>

            <div class="text-xs text-slate-500 mb-1">내 평가 평균</div>

          </div>
          <div class="bg-white rounded-xl border border-slate-200 p-3">
            <div class="text-xs text-slate-500 mb-1">선생님 평가 평균</div>

function renderStudentProgress(passages, missions, evalMap, questions) {

    main.innerHTML = `<div class="text-center py-12 bg-white rounded-xl border border-slate-200 text-slate-400">아직 시험범위가 등록되지 않았어요</div>`;

  // 펼친 지문 상세 화면

    renderPassageDetail(p, missions, evalMap, questions);
    return;
  }
  
  // 카드 그리드 (기본)
  main.innerHTML = `

      ${passages.map(p => {
        const cellEvals = missions.map(m => evalMap[p.id]?.[m.id] || {});

        return `
          <button class="passage-card bg-white rounded-xl border border-slate-200 p-4 text-left hover:border-indigo-300" data-id="${p.id}">
            <div class="font-bold text-base mb-3 text-slate-900">${esc(p.label)}</div>

                <span class="text-slate-500 w-12">내 평가</span>

              </div>
              <div class="flex items-center gap-2 text-xs">
                <span class="text-slate-500 w-12">선생님</span>

            </div>
            ${qCount ? `<div class="mt-3 pt-3 border-t border-slate-100 text-xs text-slate-500">💬 질문 ${qCount}건${unansweredCount ? ` <span class="text-amber-600">· 답변 대기 ${unansweredCount}</span>` : ''}</div>` : ''}
          </button>`;
      }).join('')}
    </div>`;
  
  main.querySelectorAll('.passage-card').forEach(btn => {
    btn.onclick = () => { state.expandedPassageId = btn.dataset.id; renderStudent(); };
  });
}

          </div>

                      ${q.answer_image_url ? `<img src="${esc(q.answer_image_url)}" class="max-h-60 rounded-lg border border-slate-200 cursor-pointer" onclick="window.open('${esc(q.answer_image_url)}', '_blank')">` : ''}
                    </div>
                  ` : `<div class="mt-3 text-xs text-amber-600">답변 대기 중...</div>`}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      ` : ''}
    </div>`;
  
  document.getElementById('backToGrid').onclick = () => { state.expandedPassageId = null; renderStudent(); };
  document.getElementById('askBtn').onclick = () => showQuestionModal(p.id, esc(p.label));
  
  // 학생 평가 단계 클릭
  main.querySelectorAll('[data-role="student"] .lvl-btn').forEach(btn => {
    btn.onclick = async () => {
      const grid = btn.parentElement;
      const passageId = grid.dataset.passage;
      const missionId = grid.dataset.mission;
      const newLevel = parseInt(btn.dataset.level);
      const currentEval = (evalMap[passageId] || {})[missionId] || {};
      const finalLevel = currentEval.student_level === newLevel ? null : newLevel;
      
      const { error } = await sb.from('evaluations').upsert({
        student_id: state.student.id,
        passage_id: passageId, mission_id: missionId,
        student_level: finalLevel,
        teacher_level: currentEval.teacher_level ?? null,
        student_count: currentEval.student_count ?? null,
        teacher_count: currentEval.teacher_count ?? null,
        student_updated_at: new Date().toISOString(),
        teacher_updated_at: currentEval.teacher_updated_at || null,
      }, { onConflict: 'student_id,passage_id,mission_id' });
      
      if (error) { toast('저장 실패', 'error'); return; }
      renderStudent();
    };
  });
  
  // 학생 카운트 입력
  main.querySelectorAll('input.my-count').forEach(input => {
    const save = async () => {
      const passageId = input.dataset.passage;
      const missionId = input.dataset.mission;
      const v = input.value.trim();
      const newCount = v === '' ? null : Math.max(0, Math.min(999, parseInt(v) || 0));
      const currentEval = (evalMap[passageId] || {})[missionId] || {};
      
      const { error } = await sb.from('evaluations').upsert({
        student_id: state.student.id,
        passage_id: passageId, mission_id: missionId,
        student_level: currentEval.student_level ?? null,
        teacher_level: currentEval.teacher_level ?? null,
        student_count: newCount,
        teacher_count: currentEval.teacher_count ?? null,
        student_updated_at: new Date().toISOString(),
        teacher_updated_at: currentEval.teacher_updated_at || null,
      }, { onConflict: 'student_id,passage_id,mission_id' });
      
      if (error) toast('저장 실패', 'error');
      else renderStudent();
    };
    input.onblur = save;
    input.onkeydown = e => { if (e.key === 'Enter') input.blur(); };
  });
}

// ===== 질문 등록 모달 =====
function showQuestionModal(passageId, passageLabel) {
  const modal = document.createElement('div');
  modal.className = 'fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4 modal-bg';
  modal.innerHTML = `
    <div class="bg-white rounded-2xl max-w-md w-full p-5 max-h-[90vh] overflow-y-auto modal-card">
      <div class="text-xs text-slate-500 mb-1">${esc(passageLabel)}</div>
      <div class="font-bold text-lg mb-3">질문하기</div>
      <textarea id="qText" rows="3" placeholder="궁금한 내용을 적어주세요" class="w-full border border-slate-300 rounded-lg p-3 text-sm mb-3 resize-none"></textarea>
      <div class="mb-3">
        <span class="text-xs text-slate-500 block mb-1.5">사진 첨부 (선택)</span>
        <input id="qImageCamera" type="file" accept="image/*" capture="environment" class="hidden">
        <input id="qImageGallery" type="file" accept="image/*" class="hidden">
        <div class="grid grid-cols-2 gap-2">
          <button type="button" id="btnCamera" class="border border-slate-300 hover:bg-slate-50 rounded-lg py-2 text-sm font-medium flex items-center justify-center gap-1">📷 사진 찍기</button>
          <button type="button" id="btnGallery" class="border border-slate-300 hover:bg-slate-50 rounded-lg py-2 text-sm font-medium flex items-center justify-center gap-1">🖼️ 갤러리</button>
        </div>
      </div>
      <div id="qPreview" class="mb-3"></div>
      <div class="flex gap-2">
        <button id="qCancel" class="flex-1 bg-slate-100 hover:bg-slate-200 py-2.5 rounded-lg text-sm font-medium">취소</button>
        <button id="qSubmit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg text-sm font-medium">올리기</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  
  let selectedFile = null;
  
  const close = () => modal.remove();
  document.getElementById('qCancel').onclick = close;
  modal.onclick = (e) => { if (e.target === modal) close(); };
  
  document.getElementById('btnCamera').onclick = () => document.getElementById('qImageCamera').click();
  document.getElementById('btnGallery').onclick = () => document.getElementById('qImageGallery').click();
  
  const handleSelect = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    selectedFile = file;
    document.getElementById('qPreview').innerHTML = `
      <div class="relative inline-block">
        <img src="${URL.createObjectURL(file)}" class="max-h-48 rounded-lg border border-slate-200">
        <button type="button" id="qClearImage" class="absolute top-1 right-1 bg-rose-600 hover:bg-rose-700 text-white w-7 h-7 rounded-full text-sm font-bold flex items-center justify-center shadow-md">×</button>
      </div>`;
    document.getElementById('qClearImage').onclick = () => {
      selectedFile = null;
      document.getElementById('qImageCamera').value = '';
      document.getElementById('qImageGallery').value = '';
      document.getElementById('qPreview').innerHTML = '';
    };
  };
  document.getElementById('qImageCamera').onchange = handleSelect;
  document.getElementById('qImageGallery').onchange = handleSelect;
  
  document.getElementById('qSubmit').onclick = async () => {
    const text = document.getElementById('qText').value.trim();
    if (!text && !selectedFile) { toast('내용이나 사진을 첨부해주세요', 'error'); return; }
    
    const btn = document.getElementById('qSubmit');
    btn.disabled = true; btn.textContent = '올리는 중...';
    
    let imageUrl = null;
    if (selectedFile) imageUrl = await uploadImage(selectedFile);
    if (selectedFile && !imageUrl) { btn.disabled = false; btn.textContent = '올리기'; return; }
    
    const { error } = await sb.from('questions').insert({
      student_id: state.student.id,
      passage_id: passageId,
      mission_id: null,
      text: text || null,
      image_url: imageUrl,
    });
    
    if (error) { toast('저장 실패: ' + error.message, 'error'); btn.disabled = false; btn.textContent = '올리기'; return; }
    
    close();
    toast('질문이 올라갔어요', 'success');
    if (state.view === 'student') renderStudent();
  };
}

        <div>
          <button id="back" class="text-sm text-slate-500 hover:text-slate-700 mb-2">← 시험 목록</button>
          <div class="flex items-center gap-2 flex-wrap">
            <h1 class="text-2xl font-bold">${esc(e.name)}</h1>
            ${dd ? dDayBadge(e.exam_date, true) : ''}
          </div>
          <div class="text-sm text-slate-500">${esc(e.school)} ${esc(e.grade)} · ${e.exam_date || '날짜미정'}</div>
        </div>
      </div>
      
      <div class="bg-white rounded-xl border border-slate-200 p-1 inline-flex flex-wrap gap-1 mb-5">
        ${[
          ['dashboard','진도 현황'],
          ['evaluate','학생별 평가'],
          ['questions','질문/답변'],
          ['passages','지문 관리'],
          ['students','학생 관리'],
          ['missions','미션 관리'],
        ].map(([k,l]) => `
          <button data-tab="${k}" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium ${state.examTab===k?'bg-indigo-600 text-white':'text-slate-600 hover:bg-slate-50'}">${l}</button>
        `).join('')}
      </div>
      
      <div id="tabContent"></div>
    </div>`;
  
  attachLogoLink();
  document.getElementById('back').onclick = () => go('admin', { exam: null });
  document.getElementById('logout').onclick = () => go('entry');
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.onclick = () => go('admin', { examTab: b.dataset.tab, selectedStudentId: null });
  });
  
  if (state.examTab === 'dashboard') await renderDashboardTab();
  else if (state.examTab === 'evaluate') await renderEvaluateTab();
  else if (state.examTab === 'questions') await renderQuestionsTab();
  else if (state.examTab === 'passages') await renderPassagesTab();
  else if (state.examTab === 'students') await renderStudentsTab();
  else if (state.examTab === 'missions') await renderMissionsTab();
}

// ----- 진도 현황 (전체 학생 매트릭스) -----
async function renderDashboardTab() {
  const c = document.getElementById('tabContent');
  c.innerHTML = `<div class="text-slate-400 py-8 text-center">불러오는 중...</div>`;
  
  const [sR, mR, pR] = await Promise.all([
    sb.from('students').select('*').eq('exam_id', state.exam.id).order('name'),
    sb.from('missions').select('*').eq('exam_id', state.exam.id).order('sort_order'),
    sb.from('passages').select('*').eq('exam_id', state.exam.id).order('sort_order'),
  ]);
  for (const r of [sR, mR, pR]) { if (r.error) { showError(r.error, c); return; } }
  
  const students = sR.data || [];
  const missions = mR.data || [];
  const passages = pR.data || [];
  
  if (!students.length) {
    c.innerHTML = `<div class="text-center py-12 bg-white rounded-xl border border-slate-200 text-slate-400">학생을 먼저 등록해주세요</div>`;
    return;
  }
  
  const studentIds = students.map(s => s.id);
  const { data: evalsData } = await sb.from('evaluations').select('*').in('student_id', studentIds);
  const evals = evalsData || [];
  
  // student_id -> passage_id -> mission_id -> {student_level, teacher_level}
  const eMap = {};
  evals.forEach(e => {
    if (!eMap[e.student_id]) eMap[e.student_id] = {};
    if (!eMap[e.student_id][e.passage_id]) eMap[e.student_id][e.passage_id] = {};
    eMap[e.student_id][e.passage_id][e.mission_id] = e;
  });
  
  // For each student, compute per-passage avg (teacher_level only) and overall
  c.innerHTML = `
    <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-200 flex justify-between items-center bg-slate-50">
        <div class="font-semibold text-sm">선생님 평가 기준 진도 현황</div>
        <div class="text-xs text-slate-500">학생 ${students.length}명 · 지문 ${passages.length}개 · 미션 ${missions.length}개</div>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 border-b border-slate-200 text-xs">
            <tr>
              <th class="text-left px-4 py-3 font-semibold sticky left-0 bg-slate-50 z-10 min-w-[100px]">학생</th>
              <th class="text-center px-3 py-3 font-semibold whitespace-nowrap">전체평균</th>
              ${passages.map(p => `<th class="text-center px-2 py-3 font-medium whitespace-nowrap min-w-[80px]">${esc(p.label)}</th>`).join('')}
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100">
            ${students.map(s => {
              const sEvals = eMap[s.id] || {};
              const allTeacher = [];
              passages.forEach(p => {
                missions.forEach(m => {
                  const e = sEvals[p.id]?.[m.id];
                  if (e?.teacher_level != null) allTeacher.push(e.teacher_level);
                });
              });
              const overallAvg = avgLevel(allTeacher);
              
              return `
                <tr class="hover:bg-slate-50">
                  <td class="px-4 py-3 sticky left-0 bg-white">
                    <button class="student-link font-medium text-slate-900 hover:text-indigo-600 underline-offset-2 hover:underline" data-id="${s.id}">${esc(s.name)}</button>
                    <div class="text-xs text-slate-400 font-mono mt-0.5">${esc(s.code)}</div>
                  </td>
                  <td class="px-3 py-3 text-center">${overallAvg ? levelBadgeBig(overallAvg.idx) : '<span class="text-slate-300 text-sm">-</span>'}</td>
                  ${passages.map(p => {
                    const passLvls = missions.map(m => sEvals[p.id]?.[m.id]?.teacher_level);
                    const passAvg = avgLevel(passLvls);
                    return `<td class="px-2 py-3 text-center">${passAvg ? levelBadge(passAvg.idx) : '<span class="text-slate-300 text-xs">-</span>'}</td>`;
                  }).join('')}
                </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
    <div class="text-xs text-slate-400 mt-3">학생 이름을 클릭하면 평가 입력 화면으로 이동해요</div>`;
  
  c.querySelectorAll('.student-link').forEach(el => {
    el.onclick = () => go('admin', { examTab: 'evaluate', selectedStudentId: el.dataset.id });
  });
}

// ----- 학생별 평가 -----
async function renderEvaluateTab() {
  const c = document.getElementById('tabContent');
  c.innerHTML = `<div class="text-slate-400 py-8 text-center">불러오는 중...</div>`;
  
  const [sR, mR, pR] = await Promise.all([
    sb.from('students').select('*').eq('exam_id', state.exam.id).order('name'),
    sb.from('missions').select('*').eq('exam_id', state.exam.id).order('sort_order'),
    sb.from('passages').select('*').eq('exam_id', state.exam.id).order('sort_order'),
  ]);
  for (const r of [sR, mR, pR]) { if (r.error) { showError(r.error, c); return; } }
  
  const students = sR.data || [];
  const missions = mR.data || [];
  const passages = pR.data || [];
  
  if (!students.length) { c.innerHTML = `<div class="text-center py-12 bg-white rounded-xl border border-slate-200 text-slate-400">학생을 먼저 등록해주세요</div>`; return; }
  if (!passages.length || !missions.length) { c.innerHTML = `<div class="text-center py-12 bg-white rounded-xl border border-slate-200 text-slate-400">지문과 미션을 먼저 등록해주세요</div>`; return; }
  
  // Default to first student
  if (!state.selectedStudentId || !students.find(s => s.id === state.selectedStudentId)) {
    state.selectedStudentId = students[0].id;
  }
  
  const selectedStudent = students.find(s => s.id === state.selectedStudentId);
  const { data: evalsData } = await sb.from('evaluations').select('*').eq('student_id', selectedStudent.id);
  const evals = evalsData || [];
  
  const evalMap = {};
  evals.forEach(e => {
    if (!evalMap[e.passage_id]) evalMap[e.passage_id] = {};
    evalMap[e.passage_id][e.mission_id] = e;
  });
  
  const myLevels = evals.map(e => e.student_level).filter(l => l != null);
  const tLevels = evals.map(e => e.teacher_level).filter(l => l != null);
  const myAvg = avgLevel(myLevels);
  const tAvg = avgLevel(tLevels);
  
  c.innerHTML = `
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
      <!-- 학생 목록 사이드바 -->
      <div class="lg:col-span-1">
        <div class="bg-white rounded-xl border border-slate-200 p-3 sticky top-4 max-h-[80vh] overflow-y-auto">
          <div class="text-xs text-slate-500 font-medium mb-2 px-2">학생 선택</div>
          <div class="space-y-1">
            ${students.map(s => `
              <button class="student-pick w-full text-left px-3 py-2 rounded-lg text-sm transition ${s.id === state.selectedStudentId ? 'bg-indigo-50 text-indigo-700 font-medium' : 'hover:bg-slate-50'}" data-id="${s.id}">
                ${esc(s.name)}
                <div class="text-xs text-slate-400 font-mono">${esc(s.code)}</div>
              </button>
            `).join('')}
          </div>
        </div>
      </div>
      
      <!-- 매트릭스 -->
      <div class="lg:col-span-3">
        <div class="bg-white rounded-xl border border-slate-200 p-4 mb-3">
          <div class="flex justify-between items-center">
            <div>
              <div class="text-xs text-slate-500">${esc(selectedStudent.school || '')} ${esc(selectedStudent.grade || '')}</div>
              <div class="font-bold text-lg">${esc(selectedStudent.name)}</div>
            </div>
            <div class="text-right text-xs">
              <div class="text-slate-500">학생 자가평가 평균: ${myAvg ? `<span class="font-medium" style="color:${LEVEL_COLORS[myAvg.idx]}">${myAvg.label}</span>` : '-'}</div>
              <div class="text-slate-500 mt-0.5">선생님 평가 평균: ${tAvg ? `<span class="font-medium" style="color:${LEVEL_COLORS[tAvg.idx]}">${tAvg.label}</span>` : '-'}</div>
            </div>
          </div>
        </div>
        
        <div class="space-y-3">
          ${passages.map(p => `
            <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
              <div class="px-4 py-2.5 border-b border-slate-100 bg-slate-50 font-semibold text-sm">${esc(p.label)}</div>
              <div class="divide-y divide-slate-100">
                ${missions.map(m => {
                  const e = (evalMap[p.id] || {})[m.id] || {};
                  return `
                    <div class="px-4 py-3">
                      <div class="flex items-center gap-2 flex-wrap mb-2">
                        <div class="font-medium text-sm">${esc(m.name)}</div>
                        ${m.track_count ? '<span class="text-xs text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded">종류 추적</span>' : ''}
                      </div>
                      <div class="grid grid-cols-1 sm:grid-cols-12 gap-2 items-center">
                        <div class="sm:col-span-3 flex items-center gap-2 text-xs">
                          <span class="text-slate-500 shrink-0">학생</span>
                          ${e.student_level != null ? levelBadge(e.student_level) : '<span class="text-slate-300">-</span>'}
                          ${m.track_count && e.student_count != null ? `<span class="text-slate-600 ml-1">${e.student_count}종</span>` : ''}
                        </div>
                        <div class="sm:col-span-9">
                          <div class="text-xs text-slate-500 mb-1">선생님 평가</div>
                          <div class="flex flex-wrap gap-2 items-center">
                            <div class="flex-1 max-w-[280px]">${levelSelector(e.teacher_level, `data-passage="${p.id}" data-mission="${m.id}" data-role="teacher"`)}</div>
                            ${m.track_count ? `<input type="number" min="0" max="999" class="t-count border border-slate-300 rounded px-2 py-1.5 text-sm w-20 text-center" placeholder="종 수" value="${e.teacher_count ?? ''}" data-passage="${p.id}" data-mission="${m.id}"><span class="text-xs text-slate-500">종</span>` : ''}
                          </div>
                        </div>
                      </div>
                    </div>`;
                }).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>`;
  
  c.querySelectorAll('.student-pick').forEach(el => {
    el.onclick = () => go('admin', { selectedStudentId: el.dataset.id });
  });
  
  c.querySelectorAll('[data-role="teacher"] .lvl-btn').forEach(btn => {
    btn.onclick = async () => {
      const grid = btn.parentElement;
      const passageId = grid.dataset.passage;
      const missionId = grid.dataset.mission;
      const newLevel = parseInt(btn.dataset.level);
      const currentEval = (evalMap[passageId] || {})[missionId] || {};
      const finalLevel = currentEval.teacher_level === newLevel ? null : newLevel;
      
      const { error } = await sb.from('evaluations').upsert({
        student_id: selectedStudent.id,
        passage_id: passageId,
        mission_id: missionId,
        student_level: currentEval.student_level ?? null,
        teacher_level: finalLevel,
        student_count: currentEval.student_count ?? null,
        teacher_count: currentEval.teacher_count ?? null,
        student_updated_at: currentEval.student_updated_at || null,
        teacher_updated_at: new Date().toISOString(),
      }, { onConflict: 'student_id,passage_id,mission_id' });
      
      if (error) { toast('저장 실패', 'error'); return; }
      renderEvaluateTab();
    };
  });
  
  c.querySelectorAll('input.t-count').forEach(input => {
    const save = async () => {
      const passageId = input.dataset.passage;
      const missionId = input.dataset.mission;
      const v = input.value.trim();
      const newCount = v === '' ? null : Math.max(0, Math.min(999, parseInt(v) || 0));
      const currentEval = (evalMap[passageId] || {})[missionId] || {};
      
      const { error } = await sb.from('evaluations').upsert({
        student_id: selectedStudent.id,
        passage_id: passageId, mission_id: missionId,
        student_level: currentEval.student_level ?? null,
        teacher_level: currentEval.teacher_level ?? null,
        student_count: currentEval.student_count ?? null,
        teacher_count: newCount,
        student_updated_at: currentEval.student_updated_at || null,
        teacher_updated_at: new Date().toISOString(),
      }, { onConflict: 'student_id,passage_id,mission_id' });
      
      if (error) toast('저장 실패', 'error');
      else renderEvaluateTab();
    };
    input.onblur = save;
    input.onkeydown = e => { if (e.key === 'Enter') input.blur(); };
  });
}

// ----- 질문/답변 (선생님) -----
async function renderQuestionsTab() {
  const c = document.getElementById('tabContent');
  c.innerHTML = `<div class="text-slate-400 py-8 text-center">불러오는 중...</div>`;
  
  const { data: students } = await sb.from('students').select('*').eq('exam_id', state.exam.id);
  if (!students || !students.length) { c.innerHTML = `<div class="text-center py-12 bg-white rounded-xl border border-slate-200 text-slate-400">학생이 없어요</div>`; return; }
  const studentIds = students.map(s => s.id);
  const sMap = Object.fromEntries(students.map(s => [s.id, s]));
  
  const [pR, mR, qR] = await Promise.all([
    sb.from('passages').select('*').eq('exam_id', state.exam.id),
    sb.from('missions').select('*').eq('exam_id', state.exam.id),
    sb.from('questions').select('*').in('student_id', studentIds).order('created_at', { ascending: false }),
  ]);
  for (const r of [pR, mR, qR]) { if (r.error) { showError(r.error, c); return; } }
  
  const passages = pR.data || [];
  const missions = mR.data || [];
  const allQuestions = qR.data || [];
  const pMap = Object.fromEntries(passages.map(p => [p.id, p.label]));
  const mMap = Object.fromEntries(missions.map(m => [m.id, m.name]));
  
  const filtered = state.questionFilter === 'unanswered'
    ? allQuestions.filter(q => !q.answered_at)
    : allQuestions;
  
  c.innerHTML = `
    <div class="bg-white rounded-xl border border-slate-200 p-1 inline-flex gap-1 mb-4">
      <button data-qf="unanswered" class="qf-btn px-4 py-2 rounded-lg text-sm font-medium ${state.questionFilter==='unanswered'?'bg-indigo-600 text-white':'text-slate-600 hover:bg-slate-50'}">미답변 (${allQuestions.filter(q => !q.answered_at).length})</button>
      <button data-qf="all" class="qf-btn px-4 py-2 rounded-lg text-sm font-medium ${state.questionFilter==='all'?'bg-indigo-600 text-white':'text-slate-600 hover:bg-slate-50'}">전체 (${allQuestions.length})</button>
    </div>
    
    <div class="space-y-3">
      ${filtered.length ? filtered.map(q => {
        const student = sMap[q.student_id] || {};
        return `
          <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
            <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
              <div class="text-sm">
                <span class="font-semibold">${esc(student.name || '?')}</span>
                <span class="text-xs text-slate-500 ml-2">${esc(pMap[q.passage_id] || '?')}${q.mission_id ? ` · ${esc(mMap[q.mission_id] || '')}` : ''}</span>
              </div>
              <div class="text-xs text-slate-400">${esc(fmtDate(q.created_at))}</div>
            </div>
            <div class="p-4">
              <div class="text-xs text-indigo-600 font-medium mb-1">질문</div>
              ${q.text ? `<div class="text-sm whitespace-pre-wrap mb-2">${esc(q.text)}</div>` : ''}
              ${q.image_url ? `<img src="${esc(q.image_url)}" class="max-h-60 rounded-lg border border-slate-200 cursor-pointer mb-2" onclick="window.open('${esc(q.image_url)}', '_blank')">` : ''}
              
              <div class="mt-3 pt-3 border-t border-slate-100">
                ${q.answer_text || q.answer_image_url ? `
                  <div class="text-xs text-emerald-600 font-medium mb-1">답변 · ${esc(fmtDate(q.answered_at))}</div>
                  ${q.answer_text ? `<div class="text-sm whitespace-pre-wrap mb-2">${esc(q.answer_text)}</div>` : ''}
                  ${q.answer_image_url ? `<img src="${esc(q.answer_image_url)}" class="max-h-60 rounded-lg border border-slate-200 cursor-pointer mb-2" onclick="window.open('${esc(q.answer_image_url)}', '_blank')">` : ''}
                  <button class="re-answer-btn text-xs text-slate-500 hover:text-indigo-600 underline" data-id="${q.id}">답변 수정</button>
                ` : `
                  <textarea data-id="${q.id}" class="ans-text w-full border border-slate-300 rounded-lg p-2 text-sm mb-2 resize-none" rows="2" placeholder="답변을 입력해주세요"></textarea>
                  <input type="file" accept="image/*" capture="environment" data-id="${q.id}" class="ans-cam-input hidden">
                  <input type="file" accept="image/*" data-id="${q.id}" class="ans-gal-input hidden">
                  <div class="ans-preview mb-2" data-id="${q.id}"></div>
                  <div class="flex items-center gap-2 flex-wrap">
                    <button type="button" data-id="${q.id}" class="ans-cam-btn border border-slate-300 hover:bg-slate-50 rounded-lg px-2.5 py-1.5 text-xs font-medium">📷 촬영</button>
                    <button type="button" data-id="${q.id}" class="ans-gal-btn border border-slate-300 hover:bg-slate-50 rounded-lg px-2.5 py-1.5 text-xs font-medium">🖼️ 갤러리</button>
                    <button data-id="${q.id}" class="ans-submit bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-3 py-1.5 rounded-lg ml-auto">답변 등록</button>
                  </div>
                `}
              </div>
            </div>
          </div>`;
      }).join('') : `<div class="text-center py-12 bg-white rounded-xl border border-slate-200 text-slate-400">${state.questionFilter==='unanswered'?'미답변 질문이 없어요':'질문이 없어요'}</div>`}
    </div>`;
  
  c.querySelectorAll('.qf-btn').forEach(b => {
    b.onclick = () => { state.questionFilter = b.dataset.qf; renderQuestionsTab(); };
  });
  
  // 카메라/갤러리 버튼 → 해당 input 트리거
  c.querySelectorAll('.ans-cam-btn').forEach(btn => {
    btn.onclick = () => c.querySelector(`input.ans-cam-input[data-id="${btn.dataset.id}"]`)?.click();
  });
  c.querySelectorAll('.ans-gal-btn').forEach(btn => {
    btn.onclick = () => c.querySelector(`input.ans-gal-input[data-id="${btn.dataset.id}"]`)?.click();
  });
  
  // 파일 선택 시 미리보기
  const handleAnsImage = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const qid = e.target.dataset.id;
    const preview = c.querySelector(`.ans-preview[data-id="${qid}"]`);
    if (preview) {
      preview.innerHTML = `
        <div class="relative inline-block">
          <img src="${URL.createObjectURL(file)}" class="max-h-40 rounded-lg border border-slate-200">
          <button type="button" class="ans-clear absolute top-1 right-1 bg-rose-600 hover:bg-rose-700 text-white w-6 h-6 rounded-full text-xs font-bold flex items-center justify-center shadow-md" data-id="${qid}">×</button>
        </div>`;
      preview.querySelector('.ans-clear').onclick = () => {
        c.querySelector(`input.ans-cam-input[data-id="${qid}"]`).value = '';
        c.querySelector(`input.ans-gal-input[data-id="${qid}"]`).value = '';
        preview.innerHTML = '';
      };
    }
  };
  c.querySelectorAll('.ans-cam-input, .ans-gal-input').forEach(input => {
    input.onchange = handleAnsImage;
  });
  
  c.querySelectorAll('.ans-submit').forEach(btn => {
    btn.onclick = async () => {
      const qid = btn.dataset.id;
      const text = c.querySelector(`textarea.ans-text[data-id="${qid}"]`).value.trim();
      const camFile = c.querySelector(`input.ans-cam-input[data-id="${qid}"]`)?.files?.[0];
      const galFile = c.querySelector(`input.ans-gal-input[data-id="${qid}"]`)?.files?.[0];
      const file = camFile || galFile;
      if (!text && !file) { toast('답변 내용이나 이미지를 입력해주세요', 'error'); return; }
      
      btn.disabled = true; btn.textContent = '저장 중...';
      let imageUrl = null;
      if (file) imageUrl = await uploadImage(file);
      if (file && !imageUrl) { btn.disabled = false; btn.textContent = '답변 등록'; return; }
      
      const { error } = await sb.from('questions').update({
        answer_text: text || null,
        answer_image_url: imageUrl,
        answered_at: new Date().toISOString(),
      }).eq('id', qid);
      
      if (error) { toast('저장 실패: ' + error.message, 'error'); btn.disabled = false; btn.textContent = '답변 등록'; return; }
      toast('답변 등록됐어요', 'success');
      renderQuestionsTab();
    };
  });
  
  c.querySelectorAll('.re-answer-btn').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('기존 답변을 지우고 새로 작성할까요?')) return;
      await sb.from('questions').update({ answer_text: null, answer_image_url: null, answered_at: null }).eq('id', btn.dataset.id);
      renderQuestionsTab();
    };
  });
}

  if (error) { showError(error, c); return; }
  const passages = data || [];
  
  c.innerHTML = `

      <div class="bg-white rounded-xl border border-slate-200 p-5">

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-2">
          <div>
            <label class="text-xs text-slate-500 block mb-0.5">연도(YY)</label>
            <input id="moYear" type="number" min="0" max="99" value="${new Date().getFullYear() % 100}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">

          <div>
            <label class="text-xs text-slate-500 block mb-0.5">시작 번호</label>
            <input id="moStart" type="number" value="1" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
          </div>
          <div>
            <label class="text-xs text-slate-500 block mb-0.5">끝 번호</label>

        <button id="addMo" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-4 py-2 text-sm font-medium">일괄 추가</button>
        <div class="text-xs text-slate-400 mt-1.5">예: "26년 6월 모의고사 1번" ~ "26년 6월 모의고사 12번"</div>
      </div>
    </div>
    
    <div class="bg-white rounded-xl border border-slate-200 p-4 mb-4">
      <details>
        <summary class="text-sm text-slate-600 cursor-pointer hover:text-slate-900 font-medium">자유 형식 일괄 추가 (모의고사 외)</summary>
        <div class="mt-3 grid grid-cols-2 sm:grid-cols-4 gap-2">
          <input id="bPrefix" placeholder="앞부분 (예: 교과서)" class="border border-slate-300 rounded-lg px-3 py-2 text-sm sm:col-span-2">
          <input id="bSuffix" value="과" placeholder="뒷부분" class="border border-slate-300 rounded-lg px-3 py-2 text-sm">
          <button id="addBulk" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-4 py-2 text-sm font-medium">추가</button>
          <input id="bStart" type="number" value="1" placeholder="시작" class="border border-slate-300 rounded-lg px-3 py-2 text-sm">
          <input id="bEnd" type="number" value="5" placeholder="끝" class="border border-slate-300 rounded-lg px-3 py-2 text-sm">
        </div>
      </details>
    </div>
    
    <div class="bg-white rounded-xl border border-slate-200 mt-4 overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-200 bg-slate-50 flex justify-between items-center gap-2 flex-wrap">
        <div class="font-semibold text-sm">등록된 지문 (${passages.length}개)</div>
        <div class="flex items-center gap-2">
          <label class="flex items-center gap-1.5 text-xs text-slate-600 cursor-pointer">
            <input type="checkbox" id="pSelectAll" class="w-4 h-4 rounded border-slate-300">
            전체 선택
          </label>
          <button id="pBulkDel" class="bg-rose-600 hover:bg-rose-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white rounded-lg px-3 py-1.5 text-xs font-medium" disabled>
            선택 삭제 (<span id="pSelCount">0</span>)
          </button>
        </div>
      </div>
      ${passages.length ? `<div class="divide-y divide-slate-100">
        ${passages.map((p, i) => `
          <div class="px-4 py-3 flex items-center justify-between gap-2">
            <div class="flex items-center gap-3 flex-1 min-w-0">
              <input type="checkbox" class="p-check w-4 h-4 rounded border-slate-300 shrink-0" data-id="${p.id}">
              <span class="text-xs text-slate-400 w-6 shrink-0">${i+1}</span>
              <input class="p-label flex-1 border border-transparent hover:border-slate-200 focus:border-slate-300 rounded px-2 py-1 text-sm min-w-0" value="${esc(p.label)}" data-id="${p.id}">
            </div>
            <div class="flex items-center gap-1 shrink-0">
              <button class="p-up text-slate-400 hover:text-slate-700 px-2 text-sm" data-id="${p.id}" data-idx="${i}">↑</button>
              <button class="p-down text-slate-400 hover:text-slate-700 px-2 text-sm" data-id="${p.id}" data-idx="${i}">↓</button>
              <button class="p-del text-slate-400 hover:text-rose-600 px-2 text-sm" data-id="${p.id}">삭제</button>
            </div>
          </div>
        `).join('')}
      </div>` : '<div class="text-center py-8 text-slate-400 text-sm">지문이 없어요</div>'}
    </div>`;
  
  document.getElementById('addOne').onclick = async () => {
    const label = document.getElementById('pLabel').value.trim();
    if (!label) return;
    const sort_order = (passages.length ? Math.max(...passages.map(p => p.sort_order || 0)) : 0) + 1;
    const { error } = await sb.from('passages').insert({ exam_id: state.exam.id, label, sort_order });
    if (error) toast('저장 실패: ' + error.message, 'error');
    else { toast('추가됐어요', 'success'); renderPassagesTab(); }
  };
  
  document.getElementById('addMo').onclick = async () => {
    const year = parseInt(document.getElementById('moYear').value);
    const month = parseInt(document.getElementById('moMonth').value);
    const start = parseInt(document.getElementById('moStart').value);
    const end = parseInt(document.getElementById('moEnd').value);
    if (isNaN(year) || isNaN(month) || isNaN(start) || isNaN(end) || start > end) { toast('값을 확인해주세요', 'error'); return; }
    if (end - start > 50) { toast('한 번에 최대 50개까지', 'error'); return; }
    
    const baseOrder = passages.length ? Math.max(...passages.map(p => p.sort_order || 0)) : 0;
    const items = [];
    for (let i = start; i <= end; i++) {
      const label = `${year}년 ${month}월 모의고사 ${i}번`;
      items.push({ exam_id: state.exam.id, label, sort_order: baseOrder + (i - start + 1) });
    }
    const { error } = await sb.from('passages').insert(items);
    if (error) toast('저장 실패: ' + error.message, 'error');
    else { toast(`${items.length}개 추가됐어요`, 'success'); renderPassagesTab(); }
  };
  
  document.getElementById('addBulk').onclick = async () => {
    const prefix = document.getElementById('bPrefix').value.trim();
    const suffix = document.getElementById('bSuffix').value.trim();
    const start = parseInt(document.getElementById('bStart').value);
    const end = parseInt(document.getElementById('bEnd').value);
    if (!prefix && !suffix) { toast('앞부분 또는 뒷부분을 입력해주세요', 'error'); return; }
    if (isNaN(start) || isNaN(end) || start > end) { toast('시작/끝 번호를 확인해주세요', 'error'); return; }
    if (end - start > 50) { toast('한 번에 최대 50개까지', 'error'); return; }
    
    const baseOrder = (passages.length ? Math.max(...passages.map(p => p.sort_order || 0)) : 0);
    const items = [];
    for (let i = start; i <= end; i++) {
      const label = `${prefix} ${i}${suffix}`.trim().replace(/\s+/g, ' ');
      items.push({ exam_id: state.exam.id, label, sort_order: baseOrder + (i - start + 1) });
    }
    const { error } = await sb.from('passages').insert(items);
    if (error) toast('저장 실패: ' + error.message, 'error');
    else { toast(`${items.length}개 추가됐어요`, 'success'); renderPassagesTab(); }
  };
  
  document.querySelectorAll('.p-label').forEach(input => {
    input.onblur = async () => {
      const newLabel = input.value.trim();
      const old = passages.find(p => p.id === input.dataset.id);
      if (!newLabel || newLabel === old?.label) return;
      await sb.from('passages').update({ label: newLabel }).eq('id', input.dataset.id);
      toast('수정됐어요', 'success');
    };
    input.onkeydown = e => { if (e.key === 'Enter') input.blur(); };
  });
  
  document.querySelectorAll('.p-del').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('이 지문과 관련 평가/질문이 모두 삭제됩니다. 계속할까요?')) return;
      await sb.from('passages').delete().eq('id', btn.dataset.id);
      toast('삭제됐어요', 'success');
      renderPassagesTab();
    };
  });
  
  const swap = async (i, j) => {
    if (j < 0 || j >= passages.length) return;
    const a = passages[i], b = passages[j];
    await Promise.all([
      sb.from('passages').update({ sort_order: b.sort_order }).eq('id', a.id),
      sb.from('passages').update({ sort_order: a.sort_order }).eq('id', b.id),
    ]);
    renderPassagesTab();
  };
  document.querySelectorAll('.p-up').forEach(b => b.onclick = () => swap(parseInt(b.dataset.idx), parseInt(b.dataset.idx) - 1));
  document.querySelectorAll('.p-down').forEach(b => b.onclick = () => swap(parseInt(b.dataset.idx), parseInt(b.dataset.idx) + 1));
  
  // 체크박스 + 일괄삭제 로직
  const updateSelCount = () => {
    const checked = document.querySelectorAll('.p-check:checked');
    const count = checked.length;
    document.getElementById('pSelCount').textContent = count;
    document.getElementById('pBulkDel').disabled = count === 0;
    const all = document.querySelectorAll('.p-check');
    document.getElementById('pSelectAll').checked = count > 0 && count === all.length;
  };
  
  document.querySelectorAll('.p-check').forEach(cb => {
    cb.onchange = updateSelCount;
  });
  
  const selectAll = document.getElementById('pSelectAll');
  if (selectAll) {
    selectAll.onchange = () => {
      document.querySelectorAll('.p-check').forEach(cb => cb.checked = selectAll.checked);
      updateSelCount();
    };
  }
  
  const bulkDel = document.getElementById('pBulkDel');
  if (bulkDel) {
    bulkDel.onclick = async () => {
      const ids = Array.from(document.querySelectorAll('.p-check:checked')).map(cb => cb.dataset.id);
      if (!ids.length) return;
      if (!confirm(`선택한 ${ids.length}개 지문과 관련된 모든 평가/질문이 삭제됩니다. 계속할까요?`)) return;
      const { error } = await sb.from('passages').delete().in('id', ids);
      if (error) toast('삭제 실패: ' + error.message, 'error');
      else { toast(`${ids.length}개 삭제됐어요`, 'success'); renderPassagesTab(); }
    };
  }
}

// ----- 학생 관리 -----
async function renderStudentsTab() {
  const c = document.getElementById('tabContent');
  c.innerHTML = `<div class="text-slate-400 py-8 text-center">불러오는 중...</div>`;
  const { data, error } = await sb.from('students').select('*').eq('exam_id', state.exam.id).order('name');
  if (error) { showError(error, c); return; }
  const students = data || [];
  
  c.innerHTML = `
    <div class="bg-white rounded-xl border border-slate-200 p-5 mb-4">
      <div class="font-semibold mb-3">학생 추가 (코드는 자동 생성)</div>
      <div class="grid grid-cols-1 sm:grid-cols-4 gap-2">
        <input id="sName" placeholder="이름" class="border border-slate-300 rounded-lg px-3 py-2 text-sm">
        <input id="sSchool" placeholder="학교 (선택)" class="border border-slate-300 rounded-lg px-3 py-2 text-sm">
        <input id="sGrade" placeholder="학년 (선택)" class="border border-slate-300 rounded-lg px-3 py-2 text-sm">
        <button id="addStudent" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-4 py-2 text-sm font-medium">추가</button>
      </div>
    </div>
    
    <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-slate-50 border-b border-slate-200">
          <tr>
            <th class="text-left px-4 py-3 font-semibold">이름</th>
            <th class="text-left px-4 py-3 font-semibold">학교/학년</th>
            <th class="text-left px-4 py-3 font-semibold">코드</th>
            <th class="px-4 py-3"></th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          ${students.length ? students.map(s => `
            <tr>
              <td class="px-4 py-3"><input class="s-name border border-transparent hover:border-slate-200 focus:border-slate-300 rounded px-2 py-1 font-medium" value="${esc(s.name)}" data-id="${s.id}"></td>
              <td class="px-4 py-3 text-slate-500 text-xs">
                <input class="s-school border border-transparent hover:border-slate-200 focus:border-slate-300 rounded px-2 py-1" value="${esc(s.school || '')}" placeholder="학교" data-id="${s.id}" style="width:90px">
                <input class="s-grade border border-transparent hover:border-slate-200 focus:border-slate-300 rounded px-2 py-1" value="${esc(s.grade || '')}" placeholder="학년" data-id="${s.id}" style="width:60px">
              </td>
              <td class="px-4 py-3">
                <input class="s-code font-mono bg-indigo-50 text-indigo-700 px-2 py-1 rounded text-xs font-semibold border border-transparent hover:border-indigo-300 focus:border-indigo-500 focus:bg-white uppercase" value="${esc(s.code)}" data-id="${s.id}" data-old="${esc(s.code)}" maxlength="10" style="width:100px">
              </td>
              <td class="px-4 py-3 text-right"><button data-id="${s.id}" class="del-student text-slate-400 hover:text-rose-600 text-xs">삭제</button></td>
            </tr>
          `).join('') : '<tr><td colspan="4" class="text-center py-12 text-slate-400">학생이 없어요</td></tr>'}
        </tbody>
      </table>
    </div>`;
  
  document.getElementById('addStudent').onclick = async () => {
    const name = document.getElementById('sName').value.trim();
    const school = document.getElementById('sSchool').value.trim();
    const grade = document.getElementById('sGrade').value.trim();
    if (!name) { toast('이름을 입력해주세요', 'error'); return; }
    let code = genCode(), tries = 0;
    while (tries < 5) {
      const { data } = await sb.from('students').select('id').eq('code', code).maybeSingle();
      if (!data) break;
      code = genCode(); tries++;
    }
    const { error } = await sb.from('students').insert({ name, school, grade, code, exam_id: state.exam.id });
    if (error) toast('저장 실패: ' + error.message, 'error');
    else { toast(`코드: ${code}`, 'success'); renderStudentsTab(); }
  };
  
  ['s-name', 's-school', 's-grade'].forEach(cls => {
    document.querySelectorAll('.' + cls).forEach(input => {
      input.onblur = async () => {
        const field = cls.split('-')[1];
        const old = students.find(s => s.id === input.dataset.id);
        const newVal = input.value.trim();
        if (newVal === (old?.[field] || '')) return;
        if (field === 'name' && !newVal) { input.value = old.name; return; }
        await sb.from('students').update({ [field]: newVal || null }).eq('id', input.dataset.id);
      };
      input.onkeydown = e => { if (e.key === 'Enter') input.blur(); };
    });
  });
  
  // 코드 수정
  document.querySelectorAll('.s-code').forEach(input => {
    input.onblur = async () => {
      const id = input.dataset.id;
      const oldCode = input.dataset.old;
      const newCode = input.value.trim().toUpperCase();
      input.value = newCode;
      
      if (!newCode || newCode === oldCode) { input.value = oldCode; return; }
      if (newCode.length < 3 || newCode.length > 10) { toast('코드는 3~10자', 'error'); input.value = oldCode; return; }
      if (!/^[A-Z0-9]+$/.test(newCode)) { toast('영문 대문자와 숫자만 가능해요', 'error'); input.value = oldCode; return; }
      
      // 중복 체크
      const { data: existing } = await sb.from('students').select('id').eq('code', newCode).neq('id', id).maybeSingle();
      if (existing) { toast('이미 사용 중인 코드예요', 'error'); input.value = oldCode; return; }
      
      const { error } = await sb.from('students').update({ code: newCode }).eq('id', id);
      if (error) { toast('저장 실패: ' + error.message, 'error'); input.value = oldCode; return; }
      toast('코드 변경됐어요', 'success');
      input.dataset.old = newCode;
    };
    input.onkeydown = e => { if (e.key === 'Enter') input.blur(); };
  });
  
  document.querySelectorAll('.del-student').forEach(el => {
    el.onclick = async () => {
      if (!confirm('이 학생과 평가/질문 기록을 모두 삭제할까요?')) return;
      await sb.from('students').delete().eq('id', el.dataset.id);
      toast('삭제됐어요', 'success');
      renderStudentsTab();
    };
  });
}

    if (!name) return;
    const sort_order = (missions.length ? Math.max(...missions.map(m => m.sort_order || 0)) : 0) + 1;
    const { error } = await sb.from('missions').insert({ exam_id: state.exam.id, name, sort_order });
    if (error) toast('저장 실패: ' + error.message, 'error');
    else { toast('추가됐어요', 'success'); renderMissionsTab(); }
  };
  
  document.querySelectorAll('.m-name').forEach(input => {
    input.onblur = async () => {
      const old = missions.find(m => m.id === input.dataset.id);
      const newName = input.value.trim();
      if (!newName || newName === old?.name) { input.value = old?.name || ''; return; }
      await sb.from('missions').update({ name: newName }).eq('id', input.dataset.id);
    };
    input.onkeydown = e => { if (e.key === 'Enter') input.blur(); };
  });
  
  document.querySelectorAll('.m-track').forEach(cb => {
    cb.onchange = async () => {
      await sb.from('missions').update({ track_count: cb.checked }).eq('id', cb.dataset.id);
      toast('변경됐어요', 'success');
    };
  });
  
  document.querySelectorAll('.m-del').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('이 미션과 관련 평가가 모두 삭제됩니다. 계속할까요?')) return;
      await sb.from('missions').delete().eq('id', btn.dataset.id);
      toast('삭제됐어요', 'success');
      renderMissionsTab();
    };
  });
  
  const swap = async (i, j) => {
    if (j < 0 || j >= missions.length) return;
    const a = missions[i], b = missions[j];
    await Promise.all([
      sb.from('missions').update({ sort_order: b.sort_order }).eq('id', a.id),
      sb.from('missions').update({ sort_order: a.sort_order }).eq('id', b.id),
    ]);
    renderMissionsTab();
  };
  document.querySelectorAll('.m-up').forEach(b => b.onclick = () => swap(parseInt(b.dataset.idx), parseInt(b.dataset.idx) - 1));
  document.querySelectorAll('.m-down').forEach(b => b.onclick = () => swap(parseInt(b.dataset.idx), parseInt(b.dataset.idx) + 1));
}

// ===== 시작 =====
render();
</script>
</body>
</html>
